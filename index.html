<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omegle: Talk to strangers!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #ffffff; color: #333; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Encabezado Clásico de Omegle */
        header { background-color: #fff; border-bottom: 2px solid #365899; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 32px; font-weight: bold; color: #365899; text-decoration: none; }
        .logo span { color: #ff7700; }
        .tagline { font-size: 14px; color: #666; font-style: italic; }

        /* Contenedor Principal */
        .main-container { display: flex; flex: 1; height: calc(100vh - 120px); padding: 10px; gap: 10px; background: #f0f2f5; }

        /* Panel de Video */
        .video-panel { flex: 2; display: flex; flex-direction: column; gap: 10px; }
        .video-box { flex: 1; background: #000; border-radius: 6px; border: 2px solid #ccc; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        /* Panel de Chat */
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; border: 1px solid #ccc; border-radius: 6px; }
        .chat-box { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
        
        /* Mensajes de Chat */
        .msg { word-break: break-word; line-height: 1.4; }
        .msg.you { color: #0000ff; font-weight: bold; }
        .msg.stranger { color: #ff0000; font-weight: bold; }
        .msg.system { color: #555; font-style: italic; font-size: 12px; margin: 4px 0; }
        .msg.safe-alert { color: #d97706; font-weight: bold; background: #fef3c7; padding: 5px; border-radius: 4px; }

        /* Área de Control e Input */
        .controls-panel { height: 60px; background: #fff; border-top: 1px solid #ccc; display: flex; padding: 8px 15px; gap: 10px; align-items: center; }
        
        button.btn-action { background: linear-gradient(to bottom, #3b5998, #2a437c); color: #fff; border: 1px solid #1e2e54; font-size: 16px; font-weight: bold; padding: 0 20px; height: 100%; border-radius: 4px; cursor: pointer; }
        button.btn-action:hover { background: #2a437c; }
        button.btn-action:disabled { background: #ccc; border-color: #aaa; cursor: not-allowed; }
        
        button.btn-stop { background: linear-gradient(to bottom, #ff4500, #cc3700); border-color: #992900; }
        button.btn-stop:hover { background: #cc3700; }

        input[type="text"] { flex: 1; height: 100%; border: 1px solid #ccc; border-radius: 4px; padding: 0 10px; font-size: 14px; outline: none; }
        input[type="text"]:focus { border-color: #ff7700; }

        .status-bar { background: #e9ebee; color: #333; padding: 5px 20px; font-size: 12px; border-top: 1px solid #ddd; }
    </style>

    <!-- Scripts de Inteligencia Artificial (IA) y Conectividad P2P -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <header>
        <div>
            <a href="#" class="logo">omegle<span>.com</span></a>
            <div class="tagline">Talk to strangers! (Edición Segura)</div>
        </div>
    </header>

    <div class="main-container">
        <!-- Panel de Videos de los Usuarios -->
        <div class="video-panel">
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">Stranger</div>
            </div>
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">You</div>
            </div>
        </div>

        <!-- Panel del Chat de Texto -->
        <div class="chat-panel">
            <div class="chat-box" id="chatBox">
                <div class="msg system">Looking for someone you can talk to...</div>
            </div>
        </div>
    </div>

    <!-- Barra Inferior de Entrada y Botones -->
    <div class="controls-panel">
        <button id="actionBtn" class="btn-action" onclick="handleActionBtn()">Start</button>
        <input type="text" id="msgInput" placeholder="Type your message and press Enter..." disabled>
        <button id="sendBtn" class="btn-action" disabled onclick="sendMessage()">Send</button>
    </div>

    <div class="status-bar" id="statusBar">Iniciando sistema de moderación...</div>

    <script>
        let localStream, peer, currentCall, currentDataConn, nsfwModel;
        let isConnected = false;
        let isSearching = false;

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const chatBox = document.getElementById('chatBox');
        const msgInput = document.getElementById('msgInput');
        const actionBtn = document.getElementById('actionBtn');
        const sendBtn = document.getElementById('sendBtn');
        const statusBar = document.getElementById('statusBar');

        const badWords = ['groseria1', 'insulto2', 'palabrota3']; // Filtro de texto personalizado

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;

                // Cargar modelo de seguridad NSFWJS
                nsfwModel = await nsfwjs.load();
                statusBar.innerText = "Seguridad por IA activa. Listo para buscar.";

                // Servidor PeerJS automático
                peer = new Peer();

                peer.on('open', (id) => {
                    addSystemMsg("Conectado al servidor de matchmaking.");
                });

                // Escuchar llamadas entrantes de extraños
                peer.on('call', (call) => {
                    if (isConnected || isSearching) {
                        currentCall = call;
                        call.answer(localStream);
                        call.on('stream', (remoteStream) => {
                            remoteVideo.srcObject = remoteStream;
                            onConnected();
                        });
                    }
                });

                // Escuchar mensajes de chat
                peer.on('connection', (conn) => {
                    currentDataConn = conn;
                    setupChatEvents();
                });

                // Escáner en tiempo real de video cada 3 segundos
                setInterval(scanVideo, 3000);

            } catch (err) {
                statusBar.innerText = "Error: Acceso a la cámara o micrófono denegado.";
                addSystemMsg("Debes permitir la cámara para usar el sitio.");
            }
        }

        // Detección automática con IA de contenido explícito
        async function scanVideo() {
            if (nsfwModel && localVideo.readyState === 4) {
                const predictions = await nsfwModel.classify(localVideo);
                const unsafe = predictions.find(p => (p.className === 'Porn' || p.className === 'Hentai') && p.probability > 0.65);
                if (unsafe) {
                    addSafeAlert("Seguridad: Contenido explícito detectado. Desconectando...");
                    disconnect();
                }
            }
        }

        // Lógica del botón principal (Start / Stop / New)
        function handleActionBtn() {
            if (isConnected || isSearching) {
                disconnect();
            } else {
                startSearch();
            }
        }

        function startSearch() {
            isSearching = true;
            actionBtn.innerText = "Stop";
            actionBtn.className = "btn-action btn-stop";
            statusBar.innerText = "Buscando un extraño...";
            addSystemMsg("Looking for someone you can talk to...");

            // Intentar emparejar usando un identificador automático de sala pública
            const randomRoom = "omegle_seguro_room_" + Math.floor(Math.random() * 5);
            
            currentDataConn = peer.connect(randomRoom);
            setupChatEvents();

            currentCall = peer.call(randomRoom, localStream);
            currentCall.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                onConnected();
            });
        }

        function onConnected() {
            isConnected = true;
            isSearching = false;
            actionBtn.innerText = "Really?";
            statusBar.innerText = "¡Conectado con un extraño!";
            addSystemMsg("You're now chatting with a random stranger. Say hi!");
            msgInput.disabled = false;
            sendBtn.disabled = false;
        }

        function setupChatEvents() {
            if (!currentDataConn) return;
            currentDataConn.on('open', () => {
                onConnected();
            });
            currentDataConn.on('data', (data) => {
                addMessage("Stranger: ", data, "stranger");
            });
        }

        function sendMessage() {
            let text = msgInput.value.trim();
            if (!text || !currentDataConn) return;

            // Filtro de groserías en texto
            badWords.forEach(word => {
                const reg = new RegExp(word, 'gi');
                text = text.replace(reg, '***');
            });

            currentDataConn.send(text);
            addMessage("You: ", text, "you");
            msgInput.value = '';
        }

        function disconnect() {
            if (currentCall) currentCall.close();
            if (currentDataConn) currentDataConn.close();
            
            remoteVideo.srcObject = null;
            isConnected = false;
            isSearching = false;

            actionBtn.innerText = "New";
            actionBtn.className = "btn-action";
            msgInput.disabled = true;
            sendBtn.disabled = true;
            statusBar.innerText = "Desconectado.";
            addSystemMsg("Stranger has disconnected.");
        }

        function addMessage(prefix, text, typeClass) {
            const msgEl = document.createElement('div');
            msgEl.className = 'msg ' + typeClass;
            msgEl.innerText = prefix + text;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addSystemMsg(text) {
            const msgEl = document.createElement('div');
            msgEl.className = 'msg system';
            msgEl.innerText = text;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addSafeAlert(text) {
            const msgEl = document.createElement('div');
            msgEl.className = 'msg safe-alert';
            msgEl.innerText = text;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        window.onload = init;
    </script>
</body>
</html>
